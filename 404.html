<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено – Stepovyk</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f17">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/icon.svg?v=a14110bd" type="image/svg+xml">
<link rel="icon" href="/favicon.png?v=6b04ccf6" type="image/png" sizes="64x64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&family=Fira+Sans:wght@400&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--text:#eef2f8;--muted:#a3aec0;--blue:#0057b8;--yellow:#ffd500}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 420px at 12% 0,rgb(0 87 184 / .26),transparent 70%),radial-gradient(700px 360px at 92% 0,rgb(255 213 0 / .08),transparent 70%) no-repeat,var(--bg);color:var(--text);font:400 18px/1.55 "Fira Sans",system-ui,sans-serif;text-align:center}
.logo{display:inline-block;margin:0 0 32px;font:400 56px/1.15 "Kaushan Script",system-ui,sans-serif;color:var(--text);text-decoration:none}
.logo .s{background:linear-gradient(var(--blue) 50%,var(--yellow) 50%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.08em 0}
h1{margin:0 0 12px;font:700 clamp(40px,8vw,64px)/1 "Fira Sans Condensed",system-ui,sans-serif;text-transform:uppercase}
p{margin:0 0 32px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--yellow);color:#14161a;font:600 18px/1 "Fira Sans Condensed",system-ui,sans-serif;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="Stepovyk"><span class="s">S</span>tepovyk</a>
  <h1>Такої сторінки немає</h1>
  <p>Усі переклади – на головній.</p>
  <a class="btn" href="/">На головну</a>
</main>
</body>
</html>
